# Despliegue completo: PostgreSQL (pgvector) + API (Hono) + web (Next) + proxy nginx.
#   cp .env.prod.example .env.prod   # y cambia los secretos
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# La app queda en http://localhost:${WEB_PORT:-8164}

name: folio-prod

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-folio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-folio}
    volumes:
      - folio-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4095
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-folio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folio}
      APP_SECRET: ${APP_SECRET:?Define APP_SECRET}
      APP_URL: ${PUBLIC_URL:-http://localhost:8164}
      PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8164}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8164}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-low}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/apps/api/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Folio <no-reply@folio.local>}
      # La pasarela simulada queda APAGADA en producción salvo que la actives a propósito.
      PAYMENTS_SIMULATED_ENABLED: ${PAYMENTS_SIMULATED_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_CURRENCY: ${MERCADOPAGO_CURRENCY:-PEN}
      MERCADOPAGO_FX_RATE: ${MERCADOPAGO_FX_RATE:-3.75}
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@folio.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD}
    volumes:
      - folio-prod-uploads:/app/apps/api/uploads
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:-http://localhost:8164}
        API_INTERNAL_URL: http://api:4095
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "${WEB_PORT:-8164}:80"

volumes:
  folio-prod-data:
  folio-prod-uploads:
