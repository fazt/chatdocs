# Proxy de producción: un solo origen público.
#   /api/*  → API (Hono). SSE sin búfer para el chat en streaming.
#   /*      → Next (landing + panel).
# Validar con: docker compose -f docker-compose.prod.yml exec proxy nginx -t
resolver 127.0.0.11 valid=10s ipv6=off;

# Log de acceso SIN query string ($uri en vez de $request): no guarda tokens ni firmas.
log_format folio '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

upstream folio_api {
  zone folio_api 64k;
  server api:4095 resolve;
}

upstream folio_web {
  zone folio_web 64k;
  server web:3000 resolve;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  access_log /var/log/nginx/access.log folio;

  # Subidas de hasta MAX_UPLOAD_MB (25 MB) + margen.
  client_max_body_size 30m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://folio_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE del chat: cada token sale al momento.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://folio_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
